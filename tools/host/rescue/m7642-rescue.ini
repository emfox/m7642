# Rescue / test stick for TCL 65S535D Pro (MStar m7642 / MT9652).
#
# The 16 KiB header of an MStar upgrade BIN is a plain MBOOT script.  pack.py
# turns each [part/<name>] section into
#
#     filepartload <DRAM_BUF_ADDR> <FirmwareFileName> <offset> <size>
#     mmc write.p  <DRAM_BUF_ADDR> <name> <size>
#
# so the BIN below rewrites four partitions to the images given in
# ./pack/.  Point it at pristine images and it is a rescue stick; point it at
# a bring-up kernel and a patched misc sector and it is a test stick.
#
# See Documentation/mstar/m7642/recovery-stick.md.

[Main]
FirmwareFileName=MstarUpgrade.bin
ProjectFolder=./pack
useHexValuesPrefix=true
SCRIPT_FIRMWARE_FILE_NAME=$$(UpgradeImage)
DRAM_BUF_ADDR=21000000
MAGIC_FOOTER=12345678
HEADER_SIZE=16KB

[HeaderScript]
Label:	\#-------------MSTAR M7642 USB Upgrade Bin Info----------------

# Keep the flash controller awake and do not touch the GPT: this stick only
# rewrites partitions that already exist.
Prefix:
	mmc rescan

# Leave the machine in a normal power-on state once the writes are done.
Suffix:
	setenv boot_ctrl null;saveenv

[part/misc]
erase=True
imageFile=${Main:ProjectFolder}/misc.img
type=partitionImage

[part/dtb]
erase=True
imageFile=${Main:ProjectFolder}/dtb.img
type=partitionImage

[part/recovery]
erase=True
imageFile=${Main:ProjectFolder}/recovery.img
type=partitionImage

[part/boot]
erase=True
imageFile=${Main:ProjectFolder}/boot.img
type=partitionImage
